[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Fingerprinted build assets never change: cache them forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Always revalidate the entry page so new builds are picked up.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
